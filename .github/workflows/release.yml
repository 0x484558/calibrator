name: Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: Require tag and Cargo version equality
        shell: bash
        run: |
          raw_tag="${GITHUB_REF_NAME}"
          tag_version="${raw_tag#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "${tag_version}" != "${cargo_version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} (parsed ${tag_version}) does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset: calibrator-windows-x86_64-v3
            rustflags: "-C target-cpu=x86-64-v3"
          - target: aarch64-pc-windows-msvc
            asset: calibrator-windows-aarch64
            rustflags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install WiX toolset
        run: dotnet tool install --global wix

      - name: Install cargo-wix
        run: cargo install --git https://github.com/volks73/cargo-wix --rev fde983c2e901970267e76b8fd68120fdd5457a57 cargo-wix --force

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build MSI with xtask
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo run --package calibrator-xtask -- package-msi --target ${{ matrix.target }}

      - name: Package release assets
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version }}"
          root="calibrator-${version}-${{ matrix.target }}"
          archive="${{ matrix.asset }}-${version}"
          mkdir -p "${root}"
          cp "target/${{ matrix.target }}/release/calibrator.exe" "${root}/"
          cp README.md LICENSE "${root}/"
          7z a "${archive}.zip" "${root}"
          sha256sum "${archive}.zip" > "${archive}.zip.sha256"

          cp "target/wix/calibrator-0.1.0-${{ matrix.target }}.msi" "${archive}.msi"
          sha256sum "${archive}.msi" > "${archive}.msi.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-${{ needs.validate.outputs.version }}
          path: |
            ${{ matrix.asset }}-${{ needs.validate.outputs.version }}.zip
            ${{ matrix.asset }}-${{ needs.validate.outputs.version }}.zip.sha256
            ${{ matrix.asset }}-${{ needs.validate.outputs.version }}.msi
            ${{ matrix.asset }}-${{ needs.validate.outputs.version }}.msi.sha256

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/*
